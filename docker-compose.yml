version: '3.8'

services:
  # FastAPI Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoroute_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - APP_NAME=Smart Plastic Waste Collection Optimization Platform
      - API_V1_PREFIX=/api
      - DATABASE_URL=sqlite:///./ecoroute.db
      - SECRET_KEY=production_jwt_secret_key_change_in_production_deployment_abc123!
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=["http://localhost","http://localhost:80","http://localhost:5173","http://localhost:3000"]
      - OSRM_SERVER_URL=http://router.project-osrm.org
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=10
    volumes:
      - backend_data:/app
      - backend_uploads:/app/uploads
    networks:
      - ecoroute-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # React SPA Frontend served via Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoroute_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecoroute-net

networks:
  ecoroute-net:
    driver: bridge

volumes:
  backend_data:
  backend_uploads:
